name: Compress for OPNSense

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create zip
        # RUNNER_TEMP ensures the zip can't end up inside the repo, thereby getting zipped itself on subsequent runs
        run: |
          zip -r "$RUNNER_TEMP/slugs_portal.zip" . \
          -x ".git/*" \
          -x ".github/workflows/*" \
          -x "README.md" \
          -x ".gitignore"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{github.run_number}}" "$RUNNER_TEMP/slugs_portal.zip" \
          --title "Release ${{github.run_number}}" \
          --notes "Automated compression ready for upload triggered by commit ${{github.sha}}"